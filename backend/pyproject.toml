[project]
name = "block-planner-backend"
version = "0.1.0"
description = "AI-Powered Automatic Block Planning - backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
  "PyJWT",
  "argon2-cffi",
  "tzdata",
  "ortools",
  "scikit-learn",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
