services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blockplanner
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d blockplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  pgdata:
